name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Copiar index.html a www
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Instalar dependencias
        run: npm install

      - name: Crear proyecto Android
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Forzar SDK 36
        run: |
          sed -i -E 's/^([[:space:]]*compileSdkVersion[[:space:]]*=[[:space:]]*)[0-9]+/\136/' android/variables.gradle
          sed -i -E 's/^([[:space:]]*targetSdkVersion[[:space:]]*=[[:space:]]*)[0-9]+/\136/' android/variables.gradle
          grep -E "SdkVersion" android/variables.gradle

      - name: Compilar APK debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Del-Garaje-a-la-Galaxia-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
